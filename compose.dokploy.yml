# engram-gateway behind Dokploy's Traefik.
#
# Dokploy builds this file from the repository and adds the Traefik labels
# for the domain configured in its UI/API, so no ports are published here.
# No secret is needed: GitHub sign-in uses the device flow (public client ID
# only) and the session-signing secret is generated on first start inside
# the data volume (mode 0600). Engram's database lives in the same volume.
#
# Set in Dokploy's environment (none of them is secret):
#   PUBLIC_BASE_URL       e.g. https://memory.example.com
#   GITHUB_CLIENT_ID      the OAuth App's client ID, with Device Flow enabled
#   ALLOWED_GITHUB_LOGINS comma-separated GitHub logins, e.g. octocat
#   GITHUB_APP_NAME       optional, the OAuth App's name shown on sign-in
#
# Optional, passed through to the engram child (e.g. Engram Cloud sync):
#   ENGRAM_CLOUD_SERVER, ENGRAM_CLOUD_TOKEN, ENGRAM_CLOUD_AUTOSYNC, ENGRAM_PROJECT

services:
  engram-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      AUTH_MODE: oauth
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID}
      GITHUB_APP_NAME: ${GITHUB_APP_NAME:-}
      ALLOWED_GITHUB_LOGINS: ${ALLOWED_GITHUB_LOGINS:?set ALLOWED_GITHUB_LOGINS}
      GATEWAY_DATA_DIR: /data/gateway
      ENGRAM_DATA_DIR: /data/engram
      ENGRAM_PROJECT: ${ENGRAM_PROJECT:-}
      ENGRAM_CLOUD_SERVER: ${ENGRAM_CLOUD_SERVER:-}
      ENGRAM_CLOUD_TOKEN: ${ENGRAM_CLOUD_TOKEN:-}
      ENGRAM_CLOUD_AUTOSYNC: ${ENGRAM_CLOUD_AUTOSYNC:-}
      # One reverse proxy (Traefik) in front: trust it for the client IP
      # (rate limits).
      TRUST_PROXY: "1"
    volumes:
      - engram-gateway-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  engram-gateway-data:
